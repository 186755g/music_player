name: Frost Player Linux package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and build renderer
        run: npm run build

      - name: Compile Electron main/preload bundle
        run: npm run build:electron

      - name: Package Linux artifacts
        run: npm run package:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frost-player-linux-artifacts
          path: dist-packages/*
          if-no-files-found: error
